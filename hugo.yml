baseURL: 'https://imxiaocheng-dev.github.io/'  # CI 会用 pages 的真实地址覆盖，这里写正式域名，本地构建也不会再泄漏 example.org
hasCJKLanguage: true
defaultContentLanguage: zh
locale: zh-cn
title: '张小橙的站'
enableRobotsTXT: true

theme:
  - PaperMod

pagination:
  pagerSize: 3
  path: page

menus:
  main:
  - name: 主页
    pageRef: /
    weight: 10
  - name: 文章
    pageRef: /posts
    weight: 20
  - name: 搜索
    pageRef: /search
    weight: 30
  - name: 时间轴
    pageRef: /archives
    weight: 40
  - name: 关于
    pageRef: /about
    weight: 50

outputs:
  home:
    - HTML
    - RSS
    - JSON # 站内搜索需要
  # 分区/标签页也输出 RSS：否则 RSS 中指到 /tags/xxx/index.xml 的链接 404
  section:
    - HTML
    - RSS
  taxonomy:
    - HTML
    - RSS
  term:
    - HTML
    - RSS

params:
  env: production
  # 站点级 SEO 兜底（首页 description / author / keywords，之前是空的）
  description: '张小橙的个人博客：嵌入式硬件、DIY 电子制作、Python 与生活随笔。'
  author: 张小橙
  keywords: [张小橙, 嵌入式, 硬件, DIY, Hugo, 博客]
  # 主题亮暗相关设置
  defaultTheme: 'dark'
  disableThemeToggle: false
  ShowBreadCrumbs: true
  ShowPostNavLinks: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowToc: true
  # 首页只列 posts 分区（之前没配，靠 Hugo 隐式推断）
  mainSections: [posts]

  assets:
    theme_color: '#151515'

  profileMode:
    enabled: false
    title: "我是张小橙"
    subtitle: "保持热爱 无畏无知"
    imageUrl: "/logo.jpg"
    imageWidth: 120
    imageHeight: 120

  homeInfoParams:
    Title: "我是张小橙"
    imageUrl: "/logo.jpg"
    Content: 保持热爱 无畏无知

  socialIcons:
    - name: bilibili
      url: "https://space.bilibili.com/97299494"
      title: "B站传送门"
    - name: github
      url: "https://github.com/imxiaocheng-dev"
      title: "Github传送门"
    - name: wechat
      url: "https://imxiaocheng-dev.github.io/wechat"
      title: "微信传送门"

markup:
  highlight:
    codeFences: true
    style: monokai
    lineNos: true
    lineNumbersInTable: true
    noClasses: false
  goldmark:
    renderer:
      unsafe: true
    parser:
      # 独立图片不再被包进 <p>，配合 render-image 输出的 <figure> 消除非法嵌套
      wrapStandAloneImageWithinParagraph: false
