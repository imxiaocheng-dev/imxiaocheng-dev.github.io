{{- /* 文章图片渲染：优先走页面资源管线，压成 webp 并写入 width/height，避免 CLS 和 <p><figure> 非法嵌套 */ -}}
{{- $src := .Destination -}}
{{- $alt := .Text | plainify -}}
{{- $caption := .Title -}}
{{- $res := .Page.Resources.GetMatch $src -}}
{{- if $res -}}
  {{- $width := $res.Width -}}
  {{- if gt $width 1000 }}{{ $width = 1000 }}{{ end -}}
  {{- $img := $res.Resize (printf "%dx webp q88" $width) -}}
  <figure class="md-figure">
    <img src="{{ $img.RelPermalink }}" width="{{ $img.Width }}" height="{{ $img.Height }}" alt="{{ $alt }}" loading="lazy" decoding="async">
    {{- with $caption }}
    <figcaption>{{ . }}</figcaption>
    {{- end }}
  </figure>
{{- else -}}
  <figure class="md-figure">
    <img src="{{ $src | safeURL }}" alt="{{ $alt }}" loading="lazy" decoding="async">
    {{- with $caption }}
    <figcaption>{{ . }}</figcaption>
    {{- end }}
  </figure>
{{- end -}}
